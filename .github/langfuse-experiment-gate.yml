# Langfuse experiment gate — run experiments on pull requests and post results as a PR comment.
# NOTES:
# - Replace 'langfuse/experiment-action@<release-tag>' with the released tag you want to use (e.g. v1.0.0).
# - Make sure repo secrets LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY exist.
# - Remove the setup-python or setup-node steps if your experiments only use one SDK.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    concurrency:
      group: langfuse-experiment-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      # Add this only if your experiments use the Python SDK
      - name: Setup Python (optional)
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run Langfuse experiment action
        uses: langfuse/experiment-action@v1.0.6
        with:
          # credentials for Langfuse (set as repository secrets)
          langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse_base_url: https://cloud.langfuse.com

          # path to your experiment scripts (relative to repo root)
          experiment_path: experiments/Charles-Demo1

          # dataset to run the experiment against
          dataset_name: Charles-Demo1

          # GitHub token so the action can comment on PRs
          github_token: ${{ github.token }}
